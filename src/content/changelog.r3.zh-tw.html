<p>共享工作階段結束測試，所有方案都能使用。背後的設計請看<a href="post-zh-tw.html">工程筆記</a>。</p>
<h3>新功能</h3>
<ul>
  <li><strong>共享工作階段</strong>：人與代理都能加入，每位參與者有自己的復原紀錄，也能逐一審查。</li>
  <li><strong>分層設定</strong>：預設值、使用者、專案三層，每個值都能追溯來源。</li>
  <li>命令面板會依使用頻率排序命令。</li>
</ul>
<h3>不相容變更</h3>
<ul>
  <li><code>collab.enabled</code> 改為 <code>session.allow</code>；第一次啟動時會自動轉換舊設定檔。</li>
</ul>
